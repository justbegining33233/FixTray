<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FixTray</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      color: #020608;
      font-family: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      text-align: center;
      padding: calc(env(safe-area-inset-top, 0px) + 2rem) 2rem calc(env(safe-area-inset-bottom, 0px) + 2rem);
    }
    img { width: min(62vw, 280px); height: auto; }
    .offline-msg { display: none; margin-top: 1.5rem; color: #475569; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div>
    <img src="ft-mark.png" alt="FixTray" />
    <p class="offline-msg" id="offline">
      Unable to connect. Please check your internet connection and try again.
    </p>
  </div>
  <script>
    setTimeout(function () {
      var node = document.getElementById('offline');
      if (node) node.style.display = 'block';
    }, 8000);
  </script>
</body>
</html>
